<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leano">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Leano · 小手机</title>
<style>
/* ============ Leano base ============ */
:root{
  --ink:#0a0a0a; --ink2:#141414; --paper:#f4f4f0; --gray:#9a9a9a; --gray2:#6f6f6f;
  --line:rgba(255,255,255,.14); --line2:rgba(0,0,0,.12);
  --statusH:54px; --dockH:96px; --homebarH:30px;
  --sw:#ffffff; --t:#f2f2ee; --t2:#b8b8b4; --card:rgba(255,255,255,.08);
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","PingFang SC","HarmonyOS Sans SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
html,body{margin:0;padding:0;background:#000;height:100%;overflow:hidden;font-family:var(--font);}
img{-webkit-user-drag:none;}
#stage{position:fixed; inset:0; background:#050505; display:flex; align-items:center; justify-content:center;}
#screen{position:relative; width:402px; height:874px; overflow:hidden; background:#000; transform-origin:center center;
  box-shadow:0 30px 80px rgba(0,0,0,.7); border-radius:0;}
.layer{position:absolute; inset:0;}
.hidden{display:none !important;}
.curtain{position:absolute; inset:0; background:#000; opacity:0; pointer-events:none; z-index:120; transition:opacity .25s;}

/* ---------- boot ---------- */
.boot{background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; z-index:100;}
.boot .logo{width:110px;height:110px; display:flex;align-items:center;justify-content:center; animation:bootPulse 1s ease;}
.boot .brand{margin-top:14px; color:#fff; font-size:26px; font-weight:700; letter-spacing:6px; opacity:0; animation:bootFade .7s .2s forwards;}
@keyframes bootPulse{0%{transform:scale(.7);opacity:.2}60%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
@keyframes bootFade{to{opacity:1}}
.boot.done{animation:bootOut .45s forwards;}
@keyframes bootOut{to{opacity:0; visibility:hidden}}

/* ---------- age gate ---------- */
.agegate{background:#000; z-index:90; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:40px;}
.agegate .ag-card{width:100%; text-align:center;}
.agegate .ag-logo{width:96px;height:96px;margin:0 auto 18px;}
.agegate h1{color:#fff; font-size:30px; margin:0 0 6px; letter-spacing:4px; font-weight:700;}
.agegate .ag-sub{color:var(--t2); font-size:13px; letter-spacing:2px; margin-bottom:34px;}
.agegate .ag-note{color:#cfcfc9; font-size:13.5px; line-height:1.9; margin-bottom:30px; text-align:left; background:rgba(255,255,255,.05); border:1px solid var(--line); border-radius:18px; padding:16px 18px;}
.agegate .ag-note b{color:#fff;}
.agegate .ag-btn{width:100%; background:#fff; color:#000; font-size:16px; font-weight:600; padding:16px; border-radius:999px; cursor:pointer; border:none; transition:transform .12s, opacity .2s;}
.agegate .ag-btn:active{transform:scale(.97); opacity:.85;}
.agegate .ag-legal{margin-top:16px; color:var(--gray2); font-size:10.5px; line-height:1.7;}

/* ---------- lock ---------- */
.lock{background:#000; z-index:60;}
.lock .lock-bg{position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.92); transform:scale(1.02);}
.lock .lock-shade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.28) 0%,rgba(0,0,0,.05) 32%,rgba(0,0,0,.05) 55%,rgba(0,0,0,.5) 100%);}
.lock .lock-top{position:absolute; top:116px; left:0; right:0; text-align:center;}
.lock .lock-date{color:rgba(255,255,255,.94); font-size:16px; letter-spacing:1px; text-shadow:0 1px 12px rgba(0,0,0,.5);}
.lock .lock-time{color:#fff; font-size:96px; font-weight:600; line-height:1.08; letter-spacing:-2px; text-shadow:0 2px 24px rgba(0,0,0,.45); font-variant-numeric:tabular-nums;}
.lock .lock-btm{position:absolute; left:0; right:0; bottom:56px; display:flex; align-items:flex-end; justify-content:space-between; padding:0 34px;}
.lock .lock-orb{width:62px; height:62px; border-radius:50%; background:linear-gradient(145deg, rgba(255,255,255,.38), rgba(255,255,255,.10)); border:1px solid rgba(255,255,255,.55); backdrop-filter:blur(18px) saturate(1.6); -webkit-backdrop-filter:blur(18px) saturate(1.6); box-shadow:0 8px 22px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.65), inset 0 -6px 12px rgba(255,255,255,.14); display:flex; align-items:center; justify-content:center; cursor:pointer; transition:transform .15s, background .2s; color:#fff;}
.lock .lock-orb:active{transform:scale(.92); background:linear-gradient(145deg, rgba(255,255,255,.5), rgba(255,255,255,.16));}
.lock .lock-mid{display:flex; flex-direction:column; align-items:center;}
.lock .lock-pill{display:flex; align-items:center; gap:8px; background:rgba(20,20,20,.66); border:1px solid rgba(255,255,255,.18); backdrop-filter:blur(14px); color:#fff; font-size:13px; padding:12px 20px; border-radius:999px; box-shadow:0 8px 24px rgba(0,0,0,.35);}
.lock .lock-pill .dot{width:7px;height:7px;border-radius:50%;background:#fff;opacity:.9;}
.lock .lock-hint{margin-top:0; color:rgba(255,255,255,.95); font-size:13px; letter-spacing:1px; text-shadow:0 1px 8px rgba(0,0,0,.6); display:flex; flex-direction:column; align-items:center; gap:4px;}
.lock .lock-hint .up{font-size:18px; animation:hintFloat 1.6s ease-in-out infinite;}
@keyframes hintFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- home ---------- */
.home{background:#000; z-index:10;}
.home-bg{position:absolute; inset:0; background-size:cover; background-position:center; filter:brightness(.78) saturate(.4);}
.home-shade{position:absolute; inset:0; background:linear-gradient(180deg,rgba(0,0,0,.5) 0%,rgba(0,0,0,.12) 34%,rgba(0,0,0,.12) 60%,rgba(0,0,0,.62) 100%);}
.home-pages{position:absolute; top:0; bottom:0; left:0; right:0; overflow:hidden;}
.home-track{position:absolute; top:0; bottom:0; left:0; display:flex; transition:transform .32s cubic-bezier(.3,.7,.2,1); will-change:transform;}
.page{width:402px; height:100%; position:relative; padding:74px 22px 110px; display:flex; flex-direction:column;}
.page::-webkit-scrollbar{display:none;}

/* widget strip */
.widget-strip{display:flex; gap:10px; margin-bottom:18px; flex:none;}
.widget-time{flex:1.3; min-width:0; background:linear-gradient(155deg, rgba(255,255,255,.30), rgba(255,255,255,.07)); border:1px solid rgba(255,255,255,.45); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6); border-radius:28px; padding:14px 16px; display:flex; flex-direction:column; justify-content:center; box-shadow:0 12px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.6); position:relative; overflow:hidden;}
.wt-date{color:rgba(255,255,255,.92); font-size:12.5px; letter-spacing:.6px; font-weight:500; text-shadow:0 1px 8px rgba(0,0,0,.5);}
.wt-time{color:#fff; font-size:64px; font-weight:200; letter-spacing:-3px; font-variant-numeric:tabular-nums; line-height:1.02; margin:2px 0; text-shadow:0 2px 18px rgba(0,0,0,.35);}
.wt-sub{color:rgba(255,255,255,.75); font-size:11px; letter-spacing:1px; text-shadow:0 1px 8px rgba(0,0,0,.5);}
.widget-mini{flex:1.4; display:grid; grid-template-columns:1fr 1fr; gap:6px;}
.w-mini{background:linear-gradient(155deg, rgba(255,255,255,.24), rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.4); backdrop-filter:blur(18px) saturate(1.5); -webkit-backdrop-filter:blur(18px) saturate(1.5); border-radius:16px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; padding:6px 2px; min-height:56px; box-shadow:inset 0 1px 0 rgba(255,255,255,.4);}
.w-mini .wm-ico{width:20px;height:20px;display:flex;align-items:center;justify-content:center;}
.w-mini .wm-t{color:#fff; font-size:15px; font-weight:700; letter-spacing:-.2px; font-variant-numeric:tabular-nums;}
.w-mini .wm-s{color:rgba(255,255,255,.6); font-size:8.5px; letter-spacing:.5px;}
.w-photo{flex:.72; border-radius:26px; overflow:hidden; border:1px solid rgba(255,255,255,.45); position:relative; min-height:104px; background:linear-gradient(155deg, rgba(255,255,255,.28), rgba(255,255,255,.06)); box-shadow:0 12px 26px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);}
.w-photo img{width:100%; height:100%; object-fit:cover; display:block;}

/* app grid */
.app-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:16px 6px; flex:none;}
.app-cell{display:flex; flex-direction:column; align-items:center; gap:6px; cursor:pointer;}
.app-cell .ic{width:60px; height:60px; border-radius:15px; overflow:hidden; position:relative; box-shadow:0 6px 16px rgba(0,0,0,.35); transition:transform .12s;}
.app-cell .ic img{width:100%;height:100%; display:block;}
.app-cell:active .ic{transform:scale(.9);}
.app-cell .lb{color:#fff; font-size:11.5px; text-shadow:0 1px 6px rgba(0,0,0,.8); max-width:72px; text-align:center; letter-spacing:.3px;}
.app-cell .bdg{position:absolute; top:-4px; right:-4px; min-width:17px; height:17px; padding:0 4px; background:#ff3b30; color:#fff; font-size:10px; font-weight:700; border-radius:999px; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 6px rgba(0,0,0,.4);}
.home-sec{height:14px; flex:none;}

/* couple widget */
.couple-card{margin:2px 0 16px; background:linear-gradient(155deg, rgba(255,255,255,.26), rgba(255,255,255,.06)); border:1px solid rgba(255,255,255,.45); backdrop-filter:blur(24px) saturate(1.6); -webkit-backdrop-filter:blur(24px) saturate(1.6); border-radius:28px; padding:16px; display:flex; align-items:center; gap:14px; flex:none; cursor:pointer; box-shadow:0 12px 30px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.55);}
.couple-avs{display:flex; flex-direction:column; gap:0; position:relative;}
.couple-avs .big{width:54px;height:54px;border-radius:50%;border:2px solid #fff;overflow:hidden;}
.couple-avs .big img{width:100%;height:100%;}
.couple-avs .heart{position:absolute; left:-16px; top:50%; transform:translateY(-50%); width:26px;height:26px; background:#fff; border-radius:50%; display:flex;align-items:center;justify-content:center; color:#000;}
.couple-info{flex:1; min-width:0;}
.couple-names{color:#fff; font-size:17px; font-weight:700; letter-spacing:.5px; display:flex; gap:8px; align-items:center;}
.couple-sub{color:rgba(255,255,255,.68); font-size:12px; margin-top:4px; letter-spacing:.5px;}
.couple-days{margin-top:8px; display:inline-block; background:rgba(255,255,255,.1); border-radius:999px; padding:3px 12px; color:#fff; font-size:11px;}
.love-btn{flex:none; background:#fff; color:#000; border:none; border-radius:999px; padding:10px 16px; font-size:13px; font-weight:700; cursor:pointer; transition:transform .12s;}
.love-btn:active{transform:scale(.92);}
.love-btn.loved{background:transparent; color:#fff; border:1.5px solid rgba(255,255,255,.8);}

/* page2 extras */
.lover-card{background:linear-gradient(155deg, rgba(255,255,255,.24), rgba(255,255,255,.05)); border:1px solid rgba(255,255,255,.45); backdrop-filter:blur(22px) saturate(1.6); -webkit-backdrop-filter:blur(22px) saturate(1.6); border-radius:26px; padding:14px; display:flex; align-items:center; gap:12px; flex:1; cursor:pointer; min-width:0; box-shadow:0 10px 26px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.5);}
.lover-card .av{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid #fff;flex:none;}
.lover-card .av img{width:100%;height:100%;}
.lover-card .nm{color:#fff;font-size:17px;font-weight:700;}
.lover-card .tg{color:rgba(255,255,255,.6); font-size:11px; margin-top:3px; letter-spacing:.4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.lover-card .arr{color:#fff; margin-left:auto; opacity:.7; font-size:18px;}
.top2{display:flex; gap:10px; margin-bottom:16px; flex:none;}
.top2 .mini2{width:132px; display:grid; grid-template-columns:1fr 1fr; gap:8px; flex:none;}
.mini2 .w-mini{min-height:68px;}

/* collage */
.collage{position:relative; height:136px; margin:2px 10px 16px; flex:none;}
.collage .ph{position:absolute; width:112px; height:136px; background:#e8e6df; border:6px solid #efede6; border-bottom-width:22px; box-shadow:0 8px 20px rgba(0,0,0,.45); transform:rotate(var(--r,0deg)); overflow:hidden;}
.collage .ph img{width:100%;height:100%;object-fit:cover; filter:contrast(1.02);}
.collage .ph .cap{position:absolute; left:0;right:0;bottom:2px; text-align:center; color:#333; font-size:8px; letter-spacing:2px; font-weight:600;}

/* page dots */
.dots{position:absolute; bottom:106px; left:0; right:0; display:flex; justify-content:center; gap:7px; z-index:5;}
.dots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.35); transition:all .25s;}
.dots i.on{width:16px;border-radius:4px;background:#fff;}

/* dock */
.dock{position:absolute; left:0; right:0; bottom:36px; z-index:6; display:flex; justify-content:center;}
.dock-in{background:rgba(18,18,18,.5); border:1px solid var(--line); backdrop-filter:blur(20px); border-radius:30px; padding:8px 10px; display:flex; gap:4px;}
.dock .app-cell{margin:0 6px;}
.dock .app-cell .lb{display:none;}
.dock .app-cell .ic{width:54px;height:54px;border-radius:14px;}

/* ---------- status bar / island ---------- */
.statusbar{position:absolute; top:0; left:0; right:0; height:var(--statusH); z-index:40; color:#fff; pointer-events:none;}
.sb-in{position:absolute; top:16px; left:0; right:0; height:22px; display:flex; align-items:center; justify-content:space-between; padding:0 22px; font-size:15px; font-weight:600; letter-spacing:.2px; font-variant-numeric:tabular-nums;}
.sb-left{display:flex; align-items:center; gap:6px; min-width:54px;}
.sb-right{display:flex; align-items:center; gap:6px;}
.sb-right img{height:13px; display:block;}
.island{position:absolute; top:10px; left:50%; transform:translateX(-50%); width:120px; height:34px; background:#000; border-radius:20px; z-index:41;}
.island .cam{position:absolute; right:11px; top:50%; transform:translateY(-50%); width:11px;height:11px;border-radius:50%; background:rgba(30,30,40,.9); border:1px solid rgba(255,255,255,.12);}
.island .cam::after{content:''; position:absolute; inset:3px; border-radius:50%; background:rgba(90,110,140,.55);}
.statusbar.sb-light .sb-in{color:#fff;}

/* home indicator */
.homeindicator{position:absolute; bottom:0; left:0; right:0; height:34px; z-index:44; display:flex; justify-content:center; align-items:flex-start; pointer-events:none;}
.hi-bar{width:138px; height:5px; border-radius:3px; background:rgba(255,255,255,.92); margin-top:9px; box-shadow:0 0 6px rgba(0,0,0,.3); pointer-events:auto;}
.hi-grab{position:absolute; inset:0;}

/* ---------- control center ---------- */
.cc{position:absolute; inset:0; z-index:50; background:rgba(10,10,10,.4); backdrop-filter:blur(26px) saturate(.8); color:#fff; display:flex; flex-direction:column; justify-content:flex-start; padding:70px 20px 30px; transform:translateY(-101%); transition:transform .38s cubic-bezier(.32,.7,.24,1);}
.cc.open{transform:translateY(0);}
.cc .cc-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom:22px;}
.cc-tile{aspect-ratio:1; border-radius:22px; background:rgba(255,255,255,.09); border:1px solid rgba(255,255,255,.1); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; transition:background .2s, transform .12s; position:relative;}
.cc-tile:active{transform:scale(.93);}
.cc-tile .ct-ic{width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.cc-tile .ct-lb{font-size:10.5px; letter-spacing:.3px; color:rgba(255,255,255,.85);}
.cc-tile.on{background:#fff; color:#000;}
.cc-tile.on .ct-lb{color:#000;}
.cc-tile.danger.on{background:#ff453a;}
.cc-title{font-size:22px; font-weight:700; margin:2px 0 14px; letter-spacing:.5px;}
.cc-row{display:flex; align-items:center; gap:12px; margin-bottom:14px; background:rgba(255,255,255,.07); border:1px solid rgba(255,255,255,.09); border-radius:20px; padding:12px 16px;}
.cc-row .cr-lb{font-size:13px; opacity:.85;}
.cc-row input[type=range]{flex:1; -webkit-appearance:none; appearance:none; height:6px; border-radius:3px; background:rgba(255,255,255,.25); outline:none;}
.cc-row input[type=range]::-webkit-slider-thumb{-webkit-appearance:none; width:24px;height:24px;border-radius:50%;background:#fff;}
.cc-now{display:flex; align-items:center; gap:14px; margin-top:auto;}
.cc-now .cn-art{width:54px;height:54px;border-radius:14px;background:#111;display:flex;align-items:center;justify-content:center;border:1px solid rgba(255,255,255,.15);}
.cc-now .cn-t{font-size:14px; font-weight:600;}
.cc-now .cn-s{font-size:11px; color:rgba(255,255,255,.55); margin-top:2px;}

/* ---------- notifications ---------- */
.notif{position:absolute; inset:0; z-index:50; transform:translateY(-101%); transition:transform .38s cubic-bezier(.32,.7,.24,1); background:linear-gradient(180deg,rgba(8,8,8,.55) 0%,rgba(8,8,8,.25) 40%,rgba(8,8,8,0) 70%);}
.notif.open{transform:translateY(0);}
.notif .nf-head{padding:64px 24px 10px; display:flex; align-items:center; justify-content:space-between;}
.notif .nf-head .t{color:#fff; font-size:26px; font-weight:700;}
.notif .nf-list{padding:0 14px;}
.nf-card{background:rgba(255,255,255,.12); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,.12); border-radius:20px; padding:13px 15px; margin-bottom:10px; display:flex; gap:12px; align-items:flex-start; color:#fff;}
.nf-card .nf-av{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:none;border:1px solid rgba(255,255,255,.2);}
.nf-card .nf-av img{width:100%;height:100%;}
.nf-card .nf-app{font-size:11px; color:rgba(255,255,255,.55); margin-bottom:3px; display:flex; gap:6px;}
.nf-card .nf-txt{font-size:13.5px; line-height:1.45;}
.nf-empty{text-align:center; color:rgba(255,255,255,.7); font-size:14px; margin-top:40px; display:flex; flex-direction:column; align-items:center; gap:10px;}

/* ---------- app switcher ---------- */
.switcher{position:absolute; inset:0; z-index:55; background:rgba(6,6,6,.86); backdrop-filter:blur(18px); display:flex; flex-direction:column; justify-content:center;}
.switcher .sw-title{color:#fff; opacity:.7; font-size:13px; text-align:center; letter-spacing:2px; margin-bottom:14px;}
.sw-track{display:flex; gap:16px; overflow-x:auto; padding:10px 24px 40px; scroll-snap-type:x mandatory;}
.sw-card{width:240px; height:420px; border-radius:26px; background:var(--ink2); border:1px solid rgba(255,255,255,.14); flex:none; scroll-snap-align:center; position:relative; overflow:hidden; box-shadow:0 24px 60px rgba(0,0,0,.55); display:flex; flex-direction:column;}
.sw-card .sw-top{height:50px; flex:none; display:flex; align-items:flex-end; justify-content:center; padding-bottom:6px;}
.sw-card .sw-top .is{width:70px;height:22px;background:#000;border-radius:14px;}
.sw-card .sw-body{flex:1; margin:0 12px 12px; border-radius:18px; background:#0d0d0d; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:#fff; position:relative; overflow:hidden;}
.sw-card .sw-body .sc-t{font-size:16px; font-weight:600;}
.sw-card .sw-body .sc-s{font-size:11px; color:rgba(255,255,255,.5);}
.sw-card .sw-x{position:absolute; top:-8px; right:-4px; width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.2); color:#fff; display:flex;align-items:center;justify-content:center; font-size:12px; cursor:pointer; z-index:3;}
.sw-close{text-align:center; margin-top:8px; color:#fff;}
.sw-close button{background:rgba(255,255,255,.16); color:#fff; border:none; border-radius:999px; padding:10px 26px; font-size:13px; cursor:pointer;}

/* ---------- toast / sheet ---------- */
.toast{position:absolute; left:50%; bottom:90px; transform:translateX(-50%) translateY(10px); background:rgba(28,28,28,.92); border:1px solid rgba(255,255,255,.2); color:#fff; font-size:13px; padding:11px 20px; border-radius:999px; z-index:95; opacity:0; transition:all .25s; pointer-events:none; max-width:80%; text-align:center; box-shadow:0 10px 30px rgba(0,0,0,.4);}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}
.sheet{position:absolute; inset:0; z-index:88; background:rgba(0,0,0,.35); display:flex; align-items:flex-end; justify-content:center; opacity:0; transition:opacity .25s; pointer-events:none;}
.sheet.open{opacity:1; pointer-events:auto;}
.sheet .sh-card{width:100%; background:#141414; color:#fff; border-radius:28px 28px 0 0; padding:10px 22px 26px; transform:translateY(30px); transition:transform .28s cubic-bezier(.3,.7,.2,1); max-height:80%; display:flex; flex-direction:column;}
.sheet.open .sh-card{transform:translateY(0);}
.sheet .sh-grip{width:40px;height:4px;border-radius:2px;background:rgba(255,255,255,.25);margin:6px auto 14px;}
.sheet .sh-title{font-size:16px; font-weight:700; text-align:center; margin-bottom:6px;}

.dev-center{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:12px; color:rgba(255,255,255,.45);}
.dev-center .dc-ic{width:80px;height:80px;border-radius:22px;background:rgba(255,255,255,.08); display:flex;align-items:center;justify-content:center;}
.badge-new{position:absolute; top:-5px; right:-8px; background:#fff; color:#000; font-size:9px; font-weight:700; padding:2px 6px; border-radius:999px;}
/* ---- 自定义图片 ---- */
.ci-row{display:flex; align-items:center; gap:10px; padding:9px 2px; border-bottom:1px solid rgba(255,255,255,.08);}
.ci-prev{width:46px;height:46px;border-radius:12px;object-fit:cover;background:#222;flex:none;}
.ci-mid{flex:1;min-width:0;}
.ci-lb{color:#fff;font-size:13.5px;}
.ci-st{color:rgba(255,255,255,.45);font-size:10.5px;margin-top:2px;}
.ci-btn{border:none;border-radius:999px;padding:7px 13px;font-size:11.5px;cursor:pointer;font-family:var(--font);flex:none;}
.ci-btn.set{background:rgba(255,255,255,.14);color:#fff;border:1px solid rgba(255,255,255,.28);}
.ci-btn.set:active{background:rgba(255,255,255,.3);}
.ci-btn.rst{background:transparent;color:rgba(255,255,255,.55);}
.ci-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px 6px;padding:2px 0 6px;}
.ci-tile{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer;position:relative;padding:4px 0;}
.ci-tile img{width:54px;height:54px;border-radius:14px;background:#222;}
.ci-tile span{font-size:9.5px;color:rgba(255,255,255,.6);max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.ci-tile:active{opacity:.7;}
.ci-dot{position:absolute;top:-2px;right:4px;width:10px;height:10px;border-radius:50%;background:#4cd964;border:1px solid #000;}

</style>
</head>

<script>
/* store.js — localStorage 数据层 */
(function(){
  const KEY = 'leano.v1';
  const DAY = 86400000;
  function defaults(){
    return {
      v:1,
      adult:false,
      user:{ name:'Ariel', motif:'kiss' },
      added:['eric'],
      created:[],
      usedCodes:[],
      ownKey:'',
      chats:{ eric:[ { role:'char', text:'你来啦，等你好一会儿了。', ts:Date.now()-3600000 } ] },
      unread:{},
      photos:[],
      callLog:[],
      recents:[],
      custom:{},
      anniv:null,
      settings:{ dark:true, sound:true, haptic:true, brightness:1, reduce:false }
    };
  }
  let state = null;
  function load(){
    if (state) return state;
    let raw = null;
    try { raw = localStorage.getItem(KEY); } catch(e){}
    const d = defaults();
    if (raw) {
      try {
        const j = JSON.parse(raw);
        Object.keys(d).forEach(k=>{ if (j[k] !== undefined) d[k] = j[k]; });
        if (j.settings) Object.assign(d.settings, j.settings);
      } catch(e){}
    }
    state = d;
    return state;
  }
  function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
  function get(){ return load(); }

  /* ---- 角色 ---- */
  function presetById(id){ return L.data.CHARS[id] || null; }
  function charById(id){
    const p = presetById(id); if (p) return p;
    return (state.created||[]).find(c=>c.id===id) || null;
  }
  function isCreated(id){ return !presetById(id); }
  function isOwned(id){
    const s = get();
    return !!s.created.find(c=>c.id===id) || s.added.indexOf(id) >= 0;
  }
  function addedPresetChars(){
    const s = get();
    return s.added.map(presetById).filter(Boolean);
  }
  function myChars(){
    const s = get();
    const list = addedPresetChars().slice();
    s.created.slice().reverse().forEach(c=>list.push(c));
    return list;
  }
  function ensureChat(id){
    if (!state.chats[id]) state.chats[id] = [];
  }
  function addChar(id){
    const s = get();
    if (s.added.indexOf(id) < 0 && !s.created.find(c=>c.id===id)) s.added.push(id);
    ensureChat(id);
    save();
  }
  function addCreatedChar(obj){
    const s = get();
    s.created.push(obj);
    ensureChat(obj.id);
    save();
  }
  function removeChar(id){
    const s = get();
    s.added = s.added.filter(x=>x!==id);
    s.created = s.created.filter(c=>c.id!==id);
    save();
  }
  /* 会话 */
  function chatOf(id){ ensureChat(id); return state.chats[id]; }
  function pushMsg(id, role, text){
    const arr = chatOf(id);
    arr.push({ role:role, text:text, ts:Date.now() });
    if (arr.length > 300) arr.splice(0, arr.length-300);
    if (role==='char'){
      if (!state.unread[id]) state.unread[id]=0;
      state.unread[id]++;
    }
    save();
    return arr[arr.length-1];
  }
  function unreadOf(id){ return state.unread[id]||0; }
  function clearUnread(id){ if(state.unread[id]){ delete state.unread[id]; save(); } }
  function totalUnread(){ let n=0; Object.keys(state.unread||{}).forEach(k=>n+=state.unread[k]); return n; }
  function lastMsg(id){
    const arr = chatOf(id); return arr.length ? arr[arr.length-1] : null;
  }
  /* 照片 */
  function addPhoto(ph){ state.photos.unshift(ph); if(state.photos.length>80) state.photos.length=80; save(); }
  /* 通话记录 */
  function logCall(entry){ state.callLog.unshift(entry); if(state.callLog.length>40) state.callLog.length=40; save(); }
  /* 相恋天数 */
  function daysTogether(){
    const s = get();
    if (!s.anniv) { s.anniv = Date.now()-53*DAY; save(); }
    return Math.max(1, Math.floor((Date.now()-s.anniv)/DAY));
  }
  /* 设置 */
  function toggleSetting(k){
    const s = get(); s.settings[k] = !s.settings[k]; save(); return s.settings[k];
  }
  function setOwnKey(k){ state.ownKey = (k||'').trim(); save(); }
  function markAdult(){ state.adult = true; save(); }
  function useCode(code){
    const up = String(code||'').trim().toUpperCase();
    if (state.usedCodes.indexOf(up)>=0) return {ok:false, reason:'used'};
    const id = L.data.CODES[up];
    if (!id) return {ok:false, reason:'invalid'};
    state.usedCodes.push(up); save(); return {ok:true, id:id};
  }
  function reset(){
    try{ localStorage.removeItem(KEY); }catch(e){}
    state = null;
    location.reload();
  }
  function bumpRecents(appId){
    state.recents = state.recents.filter(x=>x!==appId);
    state.recents.unshift(appId);
    if (state.recents.length>12) state.recents.length=12;
    save();
  }

  window.L = window.L || {};
  window.L.store = { load:load, save:save, get:get, charById:charById, isOwned:isOwned, myChars:myChars,
    addChar:addChar, addCreatedChar:addCreatedChar, removeChar:removeChar, chatOf:chatOf, pushMsg:pushMsg,
    unreadOf:unreadOf, clearUnread:clearUnread, totalUnread:totalUnread, lastMsg:lastMsg,
    addPhoto:addPhoto, logCall:logCall, daysTogether:daysTogether, toggleSetting:toggleSetting,
    setOwnKey:setOwnKey, markAdult:markAdult, useCode:useCode, reset:reset, bumpRecents:bumpRecents,
    presetById:presetById,
    setCustom:function(k,v){ state.custom = state.custom||{}; state.custom[k]=v; save(); },
    getCustom:function(k){ return (state.custom||{})[k]; },
    resetCustom:function(k){ if(state.custom){ delete state.custom[k]; save(); } },
    resetAllCustom:function(){ state.custom={}; save(); }
  };
})();
</script>
<script>
/* ui.js — 通用 UI 工具 */
(function(){
  const icons = window.L.icons;
  function q(sel, root){ return (root||document).querySelector(sel); }
  function qa(sel, root){ return Array.prototype.slice.call((root||document).querySelectorAll(sel)); }
  function h(html){
    const t = document.createElement('template');
    t.innerHTML = html.trim();
    return t.content.firstElementChild;
  }
  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function appIconImg(key, size){
    const img = document.createElement('img');
    img.src = icons.appIcon(key);
    if (size){ img.style.width = size+'px'; img.style.height = size+'px'; }
    img.alt='';
    return img;
  }
  function charAvatarUrl(ch){
    if (!ch) return icons.avatarURL('?');
    try {
      const key = ch.id ? ('avatar:'+ch.id) : null;
      if (key && window.L && window.L.store){ const c = window.L.store.getCustom(key); if (c) return c; }
    } catch(e){}
    if (ch.avatar === 'motif') return icons.avatarMotifURL(ch.motif || 'heart');
    return icons.avatarURL(ch.name);
  }
  function avatarImg(ch, size){
    const img = document.createElement('img');
    img.src = charAvatarUrl(ch);
    if (size){ img.style.width=size+'px'; img.style.height=size+'px'; }
    img.alt='';
    return img;
  }
  function pad2(n){ return (n<10?'0':'')+n; }
  function hm(ts){
    const d = ts?new Date(ts):new Date();
    return pad2(d.getHours())+':'+pad2(d.getMinutes());
  }
  function hms(ts){
    const d = ts?new Date(ts):new Date();
    return pad2(d.getHours())+':'+pad2(d.getMinutes())+':'+pad2(d.getSeconds());
  }
  function dateCN(d){
    d = d||new Date();
    const wd = ['日','一','二','三','四','五','六'][d.getDay()];
    return (d.getFullYear())+'年'+(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd;
  }
  function dateCN2(d){
    d = d||new Date();
    return (d.getFullYear())+'/'+(d.getMonth()+1)+'/'+d.getDate();
  }
  function fmtClock(ms){ // mm:ss 或 hh:mm:ss
    const s = Math.max(0, Math.floor(ms/1000));
    const hh = Math.floor(s/3600), mm = Math.floor((s%3600)/60), ss = s%60;
    return (hh>0? pad2(hh)+':' : '') + pad2(mm)+':'+pad2(ss);
  }

  let toastTimer = null;
  function toast(msg, ms){
    const el = q('#toast');
    el.innerHTML = esc(msg);
    el.classList.remove('hidden');
    el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(()=>{ el.classList.remove('show'); setTimeout(()=>el.classList.add('hidden'), 260); }, ms||1800);
  }

  /* bottom sheet */
  function sheet(title, bodyHTML, opts){
    opts = opts||{};
    const sh = q('#sheet');
    const card = h('<div class="sh-card"><div class="sh-grip"></div>'+
      (title?'<div class="sh-title"></div>':'')+
      '<div class="sh-body"></div></div>');
    if (title) q('.sh-title', card).textContent = title;
    q('.sh-body', card).innerHTML = bodyHTML;
    if (opts.buttons && opts.buttons.length){
      const btns = q('.sh-body', card);
      opts.buttons.forEach(b=>{
        const btn = h('<button class="sh-btn"></button>');
        btn.textContent = b.label;
        btn.style.marginTop = '10px';
        if (b.danger) btn.classList.add('danger');
        btn.onclick = ()=>{ sh.classList.remove('open'); if (b.onClick) b.onClick(); };
        btns.appendChild(btn);
      });
    }
    sh.innerHTML=''; sh.appendChild(card);
    sh.classList.remove('hidden');
    const close = ()=>{ sh.classList.remove('open'); setTimeout(()=>sh.classList.add('hidden'), 260); sh.onclick=null; };
    sh.onclick = function(e){ if (e.target===sh) close(); };
    q('.sh-grip', card).addEventListener('click', close);
    if (opts.onClose) sh._onClose = opts.onClose;
    sh.classList.add('open');
    return { close:close };
  }
  /* 开发中占位 sheet */
  function devSheet(name, icon){
    sheet(name || '功能', '<div style="text-align:center;padding:6px 0 4px;">'+
      '<div style="font-size:40px;margin-bottom:8px;display:flex;justify-content:center;">'+icons.inlineHTML(icon||'gear',40,'')+'</div>'+
      '「'+(name||'该功能')+'」还在制作中<br>这一版先保留入口，二期会补上真实玩法。</div>');
  }
  /* 用户卡片 / 头像行 */
  function chip(text){ return '<span class="chip">'+esc(text)+'</span>'; }
  function customVal(key){ try{ return (window.L && window.L.store)? (window.L.store.getCustom(key)||'') : ''; }catch(e){ return ''; } }
  function wallpaperURL(){ return customVal('wallpaper') || icons.wallpaperURL(); }
  function lockURL(){ return customVal('lock') || customVal('wallpaper') || icons.wallpaperURL(); }
  function slotURL(key, fallback){ return customVal(key) || fallback; }
  function pickImage(cb, maxSize){
    const inp = document.createElement('input');
    inp.type='file'; inp.accept='image/*';
    inp.style.cssText='position:absolute;left:-9999px;top:0;';
    document.body.appendChild(inp);
    inp.onchange = function(){
      const f = inp.files && inp.files[0];
      inp.remove();
      if (!f) return;
      const reader = new FileReader();
      reader.onload = function(){
        const img = new Image();
        img.onload = function(){
          const max = maxSize || 900;
          let w = img.width, h = img.height;
          if (w>max || h>max){ const sc = max/Math.max(w,h); w=Math.max(1,Math.round(w*sc)); h=Math.max(1,Math.round(h*sc)); }
          const cv = document.createElement('canvas');
          cv.width = w; cv.height = h;
          const ctx = cv.getContext('2d');
          ctx.fillStyle = '#000'; ctx.fillRect(0,0,w,h);
          ctx.drawImage(img, 0, 0, w, h);
          cb(cv.toDataURL('image/jpeg', 0.86));
        };
        img.onerror = function(){ ui.toast('图片读取失败，请换一张'); };
        img.src = reader.result;
      };
      reader.onerror = function(){ ui.toast('图片读取失败'); };
      reader.readAsDataURL(f);
    };
    inp.click();
  }

  window.L = window.L || {};
  window.L.ui = { q:q, qa:qa, h:h, esc:esc, appIconImg:appIconImg, charAvatarUrl:charAvatarUrl, avatarImg:avatarImg,
    hm:hm, hms:hms, dateCN:dateCN, dateCN2:dateCN2, fmtClock:fmtClock, toast:toast, sheet:sheet, devSheet:devSheet, chip:chip,
    customVal:customVal, wallpaperURL:wallpaperURL, lockURL:lockURL, slotURL:slotURL, pickImage:pickImage };
})();
</script>
<script>
/* engine.js — 预设回复引擎（二期可替换为真实 AI 适配器） */
(function(){
  const counters = {};
  const TAG2ARC = { '温柔':'wenrou','高冷':'gaoleng','活泼':'huopo','粘人':'zhannian','毒舌':'dushe','浪漫':'langman' };

  function scriptOf(char){
    if (char.script) return char.script;
    const arc = L.data.ARCHETYPES[TAG2ARC[(char.tags||[])[0]]] || L.data.ARCHETYPES.wenrou;
    return arc.script;
  }
  function genericKW(char){
    return [
      {re:/想你|在吗|在干嘛|在不在|忙不忙|睡了吗|在忙/, key:'miss'},
      {re:/喜欢|爱|亲|抱|乖|在乎|想我/, key:'love'},
      {re:/早安|晚安|吃饭|饿|累|困|上班|下班|熬夜/, key:'daily'},
      {re:/生气|哼|不理|难过|哭|委屈|烦/, key:'daily'}
    ];
  }
  function next(saltKey, len){
    counters[saltKey] = (counters[saltKey]||0)+1;
    return (counters[saltKey] + (len||0)) ;
  }
  function pick(arr, saltKey, len){
    if (!arr || !arr.length) return '嗯，我在听。';
    return arr[next(saltKey, len) % arr.length];
  }
  function match(text, char){
    const s = scriptOf(char);
    const kws = char.kw || genericKW(char);
    for (let i=0;i<kws.length;i++){
      if (kws[i].re.test(text)) return kws[i].key;
    }
    return 'fallback';
  }

  /* 真实 AI 适配器接口：二期把 adapter 替换成调用后端/大模型的对象
     adapter = { async ask(char, history){ return '回复文本' } }
     返回非空字符串时优先使用。 */
  let adapter = null;

  function getReply(char, history){
    if (adapter && typeof adapter.ask === 'function'){
      // 同步路径：二期可在此改为 async 调用
      return null;
    }
    const s = scriptOf(char);
    const last = history && history.length ? (history[history.length-1].text||'') : '';
    const key = last ? match(last, char) : 'greet';
    const pool = s[key] || s.fallback;
    const name = char.id + ':' + key;
    let text = pick(pool, name, history?history.length:0);
    // 人设点缀：本地角色偶尔插入一句风格化小尾巴
    if (char.kind==='local'){
      const arc = L.data.ARCHETYPES[TAG2ARC[(char.tags||[])[0]]];
      if (arc && Math.random()<0.25) text = text;
    }
    return text;
  }
  function greeting(char){
    const s = scriptOf(char);
    return pick(s.greet||s.fallback, char.id+':greet', 0);
  }
  function typingMs(text){
    return 700 + Math.min(2200, (text?text.length:0)*55) + Math.random()*500;
  }

  window.L = window.L || {};
  window.L.engine = { getReply:getReply, greeting:greeting, typingMs:typingMs, setAdapter:function(a){adapter=a;}, getAdapter:function(){return adapter;}, scriptOf:scriptOf };
})();
</script>

      {icon:'candle', label:'规则怪谈', act:'dev'}
    ]);
    addRow(page, [
      {icon:'door', label:'惊悚抉择', act:'dev'},
      {icon:'roleplay', label:'角色扮演', act:'roles'},
      {icon:'rose', label:'线下约会', act:'dev'},
      {icon:'clock', label:'时钟', act:'clock'}
    ]);
    return page;
  }
  function dockHTML(){
    const items = [
      {icon:'calendar', label:'日历', act:'dev'},
      {icon:'game', label:'游戏', act:'dev'},
      {icon:'mail', label:'邮件', act:'dev'},
      {icon:'gear', label:'设置', act:'settings'}
    ];
    return '<div class="dock-in">'+items.map(it=>cellHTML(it, true)).join('')+'</div>';
  }

  function build(){
    const home = ui.q('#home');
    home.innerHTML='';
    const bg = document.createElement('div'); bg.className='home-bg';
    bg.style.backgroundImage = 'url('+ui.wallpaperURL()+')';
    bg.style.filter = ui.customVal('wallpaper') ? 'brightness(.9) contrast(1.02)' : 'brightness(.78) saturate(.3)';
    home.appendChild(bg);
    home.appendChild(ui.h('<div class="home-shade"></div>'));
    const pagesWrap = ui.h('<div class="home-pages"><div class="home-track"></div></div>');
    const track = pagesWrap.querySelector('.home-track');
    const p1 = page1(), p2 = page2();
    track.appendChild(p1); track.appendChild(p2);
    home.appendChild(pagesWrap);
    home.appendChild(ui.h('<div class="dots"><i class="on"></i><i></i></div>'));
    const dock = ui.h('<div class="dock">'+dockHTML()+'</div>');
    home.appendChild(dock);

    home.addEventListener('click', onHomeClick);
    home._pages = {track:track, p1:p1, p2:p2};
    st.rendered = true;
    slideTo(0);
    refresh();
    return home;
  }
  function onHomeClick(e){
    const cell = e.target.closest('[data-act]');
    if (!cell) return;
    const act = cell.dataset.act, arg = cell.dataset.arg;
    if (act === 'lovecard'){
      // 点卡片本身打开与 Eric 的聊天；Love me 按钮单独处理
      if (e.target.closest('.love-btn')) { doLove(); return; }
      window.L.apps.openChat('eric');
      return;
    }
    if (act === 'lover'){ window.L.apps.openChat('eric'); return; }
    window.L.system.tapHaptic && window.L.system.tapHaptic();
    if (act === 'dev'){
      const lbel = (cell.querySelector('.lb') || cell.querySelector('.wm-t') || {}).textContent || '功能';
      window.L.ui.devSheet(lbel);
      return;
    }
    window.L.apps.run(act, arg);
  }
  function doLove(){
    const s = window.L.store.get();
    if (!window.L.store.isOwned('eric')) window.L.store.addChar('eric');
    window.L.store.clearUnread('eric');
    const u = window.L.store.pushMsg('eric','user','Love me 💘');
    window.L.store.pushMsg('eric','char','收到。这句话我收下了，不许反悔。');
    window.L.ui.toast('已向 '+s.user.name+' × Eric 表达爱意');
    refreshBadges();
  }
  function slideTo(i){
    if (i<0||i>1) return;
    st.idx = i;
    const track = ui.q('#home .home-track');
    if (track) track.style.transform = 'translateX('+(-i*402)+'px)';
    const dots = ui.qa('#home .dots i');
    dots.forEach((d,k)=>d.classList.toggle('on', k===i));
  }
  function refresh(){
    if (!st.rendered) return;
    const home = ui.q('#home');
    if (home._pages){
      tickWidgetStrip(home._pages.p1._ws);
      refreshCouple(home._pages.p1._couple);
      refreshLover(home._pages.p2._lover);
    }
    refreshBadges();
  }
  function refreshBadges(){
    const n = window.L.store.totalUnread();
    ui.qa('#home [data-act="chat"] .bdg, #home [data-act="roles"] .bdg').forEach(b=>{
      b.style.display = n>0?'flex':'none';
      b.textContent = n>99?'99+':n;
    });
    const s = window.L.store.get();
    ui.qa('#home .uname').forEach(x=> x.textContent = (s.user.name||'Ariel'));
  }

  window.L = window.L || {};
  window.L.home = { build:build, slideTo:slideTo, refresh:refresh, refreshBadges:refreshBadges, get idx(){return st.idx;} };
})();
</script>
<script>
/* apps-core.js — 应用注册表 + 聊天/电话/相机 */
(function(){
  const ui = window.L.ui, icons = window.L.icons;
  const DEFS = {};

  function register(id, title, icon, builder){
    DEFS[id] = { title:title, icon:icon, build:builder };
  }
  function build(id, opts){
    const d = DEFS[id];
    if (!d) return ui.h('<div class="app"><div class="body"></div></div>');
    const el = ui.h('<div class="app app-view-anim"></div>');
    d.build(el, opts||{});
    return el;
  }
  function run(act, arg){
    const map = { chat:'chat', phone:'phone', camera:'camera', photos:'photos', calc:'calc', clock:'clock', settings:'settings', roles:'roles' };
    const id = map[act];
    if (id) window.L.system.openApp(id, arg?{arg:arg}:{});
    else if (act==='roles:key') window.L.system.openApp('roles', {tab:'key'});
    else ui.devSheet('功能');
  }
  function openChat(charId){
    window.L.system.openApp('chat', {charId:charId||null});
  }

  /* ================= 聊天 ================= */
  function buildChat(el){
    el.classList.add('chat-app');
    const bg = document.createElement('div'); bg.className='bg-img';
    bg.style.backgroundImage='url('+ui.wallpaperURL()+')';
    el.appendChild(bg); el.appendChild(ui.h('<div class="bg-shade"></div>'));
    const head = ui.h('<div class="app-head"><div class="ah-t">微信 · Leano</div>'+
      '<div class="ah-side" style="margin-left:auto"></div></div>');
    head.querySelector('.ah-side').innerHTML = icons.inlineHTML('plus', 18, 'ah-btn');
    head.querySelector('.ah-side').firstElementChild.addEventListener('click', ()=> showHub(el, 'plaza'));
    el.appendChild(head);
    const body = ui.h('<div class="body"></div>');
    el.appendChild(body);
    el._body = body;
    showList(el);
  }
  function sortedChats(){
    const chars = window.L.store.myChars();
    return chars.slice().sort((a,b)=>{
      const la = window.L.store.lastMsg(a.id), lb = window.L.store.lastMsg(b.id);
      return (lb?lb.ts:0)-(la?la.ts:0);
    });
  }
  function showList(el){
    let body = (el._body && el.contains(el._body)) ? el._body : null;
    if (!body){ body = ui.h('<div class="body"></div>'); el.appendChild(body); }
    el._body = body;
    body.innerHTML='';
    const head = el.querySelector('.app-head');
    if (head){ head.innerHTML = '<div class="ah-t">微信 · Leano</div><div class="ah-side" style="margin-left:auto"></div>'; const hs = head.querySelector('.ah-side'); hs.innerHTML = icons.inlineHTML('plus', 18, 'ah-btn'); hs.firstElementChild.addEventListener('click', ()=> showHub(el, 'plaza')); }
    if (!el.querySelector('.bg-img')){
      const b1 = document.createElement('div'); b1.className='bg-img'; b1.style.backgroundImage='url('+ui.wallpaperURL()+')';
      const b2 = ui.h('<div class="bg-shade"></div>');
      el.insertBefore(b1, el.firstChild);
      el.insertBefore(b2, b1.nextSibling);
    }
    const list = ui.h('<div class="chat-list"></div>');
    const chars = sortedChats();
    if (!chars.length){
      const empty = ui.h('<div class="chat-empty"><div class="ce-ic">'+icons.inlineHTML('heartLine',34,'')+'</div><div>还没有角色，去添加一个吧</div></div>');
      body.appendChild(empty);
    } else {
      chars.forEach(ch=>{
        const lm = window.L.store.lastMsg(ch.id);
        const card = ui.h('<div class="chat-card"><div class="av"></div><div class="cc-info"><div class="cc-name"></div><div class="cc-last"></div></div>'+
          '<div class="cc-meta"><div class="cc-time"></div><div class="cc-bdg" style="display:none"></div></div></div>');
        card.querySelector('.av').appendChild(ui.avatarImg(ch,50));
        card.querySelector('.cc-name').textContent = ch.name;
        const txt = lm? (lm.role==='char'?'':('我: '))+lm.text : '说点什么吧…';
        card.querySelector('.cc-last').textContent = txt;
        if (lm) card.querySelector('.cc-time').textContent = ui.hm(lm.ts);
        const un = window.L.store.unreadOf(ch.id);
        const bdg = card.querySelector('.cc-bdg');
        if (un>0){ bdg.style.display='flex'; bdg.textContent = un>99?'99+':un; }
        card.addEventListener('click', ()=> openConv(el, ch.id));
        list.appendChild(card);
      });
      body.appendChild(list);
    }
    // 底部“去角色广场”按钮
    const go = ui.h('<div style="padding:2px 16px 14px;text-align:center"><button class="le-btn ghost" style="width:100%">＋ 角色广场 / 接key / 自建</button></div>');
    go.querySelector('button').onclick = ()=> showHub(el, 'plaza');
    body.appendChild(go);
    el._body = body;
  }
  function openConv(el, charId){
    const ch = window.L.store.charById(charId);
    if (!ch) return;
    window.L.store.clearUnread(charId);
    const body = el._body;
    body.innerHTML='';
    const conv = ui.h('<div class="conv"><div class="conv-msgs"></div><div class="conv-bar"></div></div>');
    body.appendChild(conv);
    // 若历史为空，先给一句开场白
    const arr = window.L.store.chatOf(charId);
    if (!arr.length){ window.L.store.pushMsg(charId,'char', window.L.engine.greeting(ch)); }
    const msgs = conv.querySelector('.conv-msgs');
    function render(){
      msgs.innerHTML='';
      const list = window.L.store.chatOf(charId);
      list.forEach(m=>{
        const mine = m.role==='user';
        const row = ui.h('<div class="msg '+(mine?'me':'them')+'">'+(mine?'':'<div class="m-av"></div>')+
          '<div class="m-bub"></div><div class="m-time"></div>'+(mine?'':'')+'</div>');
        if (!mine) row.querySelector('.m-av').appendChild(ui.avatarImg(ch,30));
        row.querySelector('.m-bub').textContent = m.text;
        row.querySelector('.m-time').textContent = ui.hm(m.ts);
        msgs.appendChild(row);
      });
      msgs.scrollTop = msgs.scrollHeight;
    }
    render();
    const bar = conv.querySelector('.conv-bar');
    const input = ui.h('<input type="text" placeholder="发消息…" maxlength="500">');
    const callb = ui.h('<button class="callb" title="通话">'+icons.inlineHTML('phone',16,'')+'</button>');
    const send = ui.h('<button class="send" title="发送">'+icons.inlineHTML('send',16,'')+'</button>');
    bar.appendChild(input); bar.appendChild(callb); bar.appendChild(send);
    input.focus && input.focus();
    function sendMsg(){
      const txt = input.value.trim();
      if (!txt) return;
      input.value='';
      window.L.store.pushMsg(charId,'user',txt);
      render();
      const typing = ui.h('<div class="typing"><div class="bub"><i></i><i></i><i></i></div></div>');
      msgs.appendChild(typing); msgs.scrollTop = msgs.scrollHeight;
      const reply = window.L.engine.getReply(ch, window.L.store.chatOf(charId).slice(0,-1));
      setTimeout(()=>{
        if (typing.parentNode) typing.remove();
        window.L.store.pushMsg(charId,'char',reply);
        render();
      }, window.L.engine.typingMs(reply));
    }
    send.addEventListener('click', sendMsg);
    input.addEventListener('keydown', e=>{ if(e.key==='Enter') sendMsg(); });
    callb.addEventListener('click', ()=> openCall({name:ch.name, avatar:ch, number:'LEANO'}, ()=>{ openConv(el, charId); }));
    // 顶部头部改为返回 + 名字 + 通话
    const head = el.querySelector('.app-head');
    head.innerHTML = '<div class="ah-side"><button class="ah-btn backb">'+icons.inlineHTML('back',18,'')+'</button></div>'+
      '<div class="ah-t" style="position:static;transform:none"></div>'+
      '<div class="ah-side"><button class="ah-btn phoneb">'+icons.inlineHTML('phone',16,'')+'</button></div>';
    head.querySelector('.ah-t').textContent = ch.name;
    head.querySelector('.backb').onclick = ()=> showList(el);
    head.querySelector('.phoneb').onclick = ()=> openCall({name:ch.name, avatar:ch, number:'LEANO'}, ()=>{ openConv(el, charId); });
    // 还原 head 布局（ah-t 绝对定位样式被覆盖）
    const t = head.querySelector('.ah-t');
    t.style.cssText = 'position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:16px;font-weight:700;max-width:60%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;';
  }
  function showHub(el, tab){
    if (window.L.roles && window.L.roles.showHub){
      window.L.roles.showHub(el, {tab:tab, back:()=>{ const t = el._returnTo||'list'; if(t==='list') showList(el); else window.L.system.goHome(); }});
    }
  }

  /* ================= 电话 ================= */
  function buildPhone(el){
    el.classList.add('phone-app');
    el.appendChild(ui.h('<div class="app-head"><div class="ah-t">电话</div><div class="ah-spacer"></div><div class="ah-side"></div></div>'));
    const body = ui.h('<div class="body"></div>');
    el.appendChild(body);
    const tabs = ui.h('<div class="seg phone-tabs"><button data-t="recents">最近</button><button data-t="contacts">联系人</button><button data-t="dial" class="on">拨号</button></div>');
    el.appendChild(tabs);
    const pbody = ui.h('<div class="phone-body"></div>');
    el.appendChild(pbody);
    const showTab = (t)=>{
      tabs.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.t===t));
      pbody.innerHTML='';
      if (t==='dial') drawDial(pbody);
      else if (t==='recents') drawRecents(pbody);
      else drawContacts(pbody);
    };
    tabs.addEventListener('click', e=>{ const b=e.target.closest('button'); if(b) showTab(b.dataset.t); });
    showTab('dial');
  }
  function drawRecents(pbody){
    const log = window.L.store.get().callLog;
    const box = ui.h('<div class="recents"></div>');
    if (!log.length){
      box.appendChild(ui.h('<div class="chat-empty"><div class="ce-ic">'+icons.inlineHTML('phone',30,'')+'</div><div>暂无通话记录</div></div>'));
    } else {
      log.forEach(r=>{
        const row = ui.h('<div class="rec-row"><div class="rr-av"></div><div><div class="rr-n"></div><div class="rr-s"></div></div><div class="rr-ic">↩</div></div>');
        const ch = r.avatar;
        row.querySelector('.rr-av').appendChild(ui.avatarImg(ch,42));
        row.querySelector('.rr-n').textContent = r.name || r.number || '未知';
        row.querySelector('.rr-s').textContent = r.kind + ' · ' + ui.hm(r.ts);
        row.addEventListener('click', ()=> openCall(r, ()=>{}));
        box.appendChild(row);
      });
    }
    pbody.appendChild(box);
  }
  function drawContacts(pbody){
    const chars = window.L.store.myChars();
    const box = ui.h('<div class="recents"></div>');
    if (!chars.length){
      box.appendChild(ui.h('<div class="chat-empty"><div class="ce-ic">'+icons.inlineHTML('user',30,'')+'</div><div>还没有联系人，去角色广场添加</div></div>'));
    } else {
      chars.forEach(ch=>{
        const row = ui.h('<div class="rec-row"><div class="rr-av"></div><div><div class="rr-n"></div><div class="rr-s"></div></div><div class="rr-ic">'+icons.inlineHTML('phone',15,'')+'</div></div>');
        row.querySelector('.rr-av').appendChild(ui.avatarImg(ch,42));
        row.querySelector('.rr-n').textContent = ch.name;
        row.querySelector('.rr-s').textContent = (ch.role||'恋人')+' · '+(ch.age||'')+'岁';
        row.addEventListener('click', ()=> openCall({name:ch.name, avatar:ch, number:'LEANO'}, ()=>{}));
        box.appendChild(row);
      });
    }
    pbody.appendChild(box);
  }
  function drawDial(pbody){
    const num = ui.h('<div class="dial-num"></div>');
    const pad = ui.h('<div class="dialpad"></div>');
    const keys = [
      ['1','',''],['2','ABC',''],['3','DEF',''],
      ['4','GHI',''],['5','JKL',''],['6','MNO',''],
      ['7','PQRS',''],['8','TUV',''],['9','WXYZ',''],
      ['*','',''],['0','+',''],['#','','']
    ];
    keys.forEach(k=>{
      const r = pad.querySelector('.dial-row');
      if (!r || r.children.length>=3){
        if (r) pad.appendChild(r);
        pad.appendChild(ui.h('<div class="dial-row"></div>'));
      }
      const lastRow = pad.lastElementChild;
      const key = ui.h('<button class="dial-key"><span class="dk-n"></span><span class="dk-l"></span></button>');
      key.querySelector('.dk-n').textContent = k[0];
      key.querySelector('.dk-l').textContent = k[1]||'';
      key.addEventListener('click', ()=> num.textContent = (num.textContent + k[0]).slice(0,20));
      lastRow.appendChild(key);
    });
    const ops = ui.h('<div class="dial-ops"><button class="del-btn">⌫</button><button class="call-btn">'+icons.inlineHTML('phone',26,'')+'</button></div>');
    ops.querySelector('.del-btn').addEventListener('click', ()=> num.textContent = num.textContent.slice(0,-1));
    ops.querySelector('.call-btn').addEventListener('click', ()=>{
      const number = num.textContent || '';
      if (!number) return;
      const ch = window.L.store.myChars().find(c=> c.name===number || c.number===number);
      openCall({name: ch?ch.name:number, avatar: ch||null, number:number}, ()=>{});
    });
    pbody.appendChild(num); pbody.appendChild(pad); pbody.appendChild(ops);
  }

  /* ============ 通话界面 ============ */
  function openCall(opts, onEnd){
    const overlay = ui.h('<div class="call-screen"></div>');
    const avatar = opts.avatar;
    const bg = document.createElement('div'); bg.className='cs-bg';
    bg.style.backgroundImage = 'url('+ (avatar? ui.charAvatarUrl(avatar) : ui.wallpaperURL()) +')';
    overlay.appendChild(bg); overlay.appendChild(ui.h('<div class="cs-shade"></div>'));
    const inr = ui.h('<div class="cs-in"><div class="cs-state">正在连接…</div><div class="cs-av"></div><div class="cs-name"></div><div class="cs-sub"></div></div>');
    overlay.appendChild(inr);
    inr.querySelector('.cs-av').appendChild(ui.avatarImg(avatar||{name:opts.name||'号码', avatar:'motif', motif:'heart'},110));
    inr.querySelector('.cs-name').textContent = opts.name || opts.number || '未知';
    const sub = inr.querySelector('.cs-sub');
    const ops = ui.h('<div class="cs-ops"><button class="cs-op spk">'+icons.inlineHTML('speaker',22,'')+'</button><button class="cs-op end">'+icons.inlineHTML('endcall',24,'')+'</button><button class="cs-op mute">'+icons.inlineHTML('mic',22,'')+'</button></div>');
    overlay.appendChild(ops);
    window.L.system.hideHomeIndicator && window.L.system.hideHomeIndicator();
    const av = window.L.q ? ui.q('#appview') : document.querySelector('#appview');
    av.appendChild(overlay);
    let sec = 0, timer=null;
    const t0 = Date.now();
    const conn = setTimeout(()=>{
      inr.querySelector('.cs-state').textContent = '通话中';
      timer = setInterval(()=>{
        sec++;
        sub.textContent = '00:'+ui.fmtClock(sec*1000);
      }, 1000);
      const caption = ui.h('<div class="cs-caption"></div>');
      caption.textContent = (avatar && window.L.engine ? window.L.engine.greeting(avatar) : '你好呀，接通啦。');
      overlay.appendChild(caption);
      setTimeout(()=>{ if(caption.parentNode) caption.remove(); }, 4000);
    }, 1600);
    function end(){
      clearTimeout(conn); clearInterval(timer);
      window.L.store.logCall({name:opts.name||opts.number||'未知', avatar:avatar||{name:'未知',avatar:'motif',motif:'heart'}, number:opts.number||'', kind:'呼出', ts:Date.now()});
      overlay.remove();
      window.L.system.showHomeIndicator && window.L.system.showHomeIndicator();
      onEnd && onEnd();
    }
    ops.querySelector('.end').addEventListener('click', end);
    ops.querySelector('.mute').addEventListener('click', function(){ this.classList.toggle('on'); });
    ops.querySelector('.spk').addEventListener('click', function(){ this.classList.toggle('on'); });
  }

  register('chat', '微信 · Leano', 'wechat', buildChat);
  register('phone', '电话', 'phone', buildPhone);
  register('camera', '相机', 'camera', buildCamera);

  function buildCamera(el){
    el.classList.add('camera-app');
    el.style.background='#000';
    const stage = ui.h('<div class="cam-stage"><canvas class="cam-canvas"></canvas><div class="cam-gridlines"></div><div class="cam-mode">拍照</div><div class="cam-flash"></div>'+
      '<div class="cam-ops"><button class="cam-side">'+icons.inlineHTML('flash',18,'')+'</button><button class="shutter"></button><button class="cam-side">'+icons.inlineHTML('flip',20,'')+'</button></div></div>');
    el.appendChild(stage);
    const canvas = stage.querySelector('canvas');
    const ctx = canvas.getContext('2d');
    let raf = 0, flip = false;
    function size(){
      const r = canvas.parentElement.getBoundingClientRect();
      canvas.width = r.width; canvas.height = r.height;
    }
    const t0 = Date.now();
    function frame(){
      const r = canvas.parentElement.getBoundingClientRect();
      const w = Math.max(1, Math.round(r.width));
      const h = Math.max(1, Math.round(r.height));
      if (canvas.width !== w) canvas.width = w;
      if (canvas.height !== h) canvas.height = h;
      if (!w || !h){ raf = requestAnimationFrame(frame); return; }
      ctx.fillStyle = '#0b0b0b'; ctx.fillRect(0,0,w,h);
      const t = (Date.now()-t0)/1000;
      // 黑白“取景”噪点感
      for (let i=0;i<34;i++){
        const x = (i*137.5 + t*6)%(w+80)-40;
        const y = ((i*97.3)%h + Math.sin(t*0.4+i)*14);
        const rad = 18+(i%5)*9;
        const g = ctx.createRadialGradient(x,y,2,x,y,rad);
        g.addColorStop(0,'rgba(255,255,255,'+(0.03+ (i%4)*0.012)+')');
        g.addColorStop(1,'rgba(255,255,255,0)');
        ctx.fillStyle = g;
        ctx.beginPath(); ctx.arc(x,y,rad,0,6.283); ctx.fill();
      }
      // 中心主体轮廓（黑白剪影，翻转时换边）
      const cx = w/2, cy = h*0.5;
      const s = Math.min(w,h)/300;
      ctx.save();
      ctx.translate(cx, cy); ctx.scale(s,s);
      ctx.fillStyle='rgba(235,233,225,0.9)';
      if (!flip){
        ctx.beginPath();
        ctx.moveTo(-70,-20); ctx.bezierCurveTo(-70,-120,10,-170,90,-150);
        ctx.bezierCurveTo(10,-120,-10,-70,-10,-20); ctx.closePath(); ctx.fill();
      } else {
        ctx.beginPath();
        ctx.moveTo(70,-20); ctx.bezierCurveTo(70,-120,-10,-170,-90,-150);
        ctx.bezierCurveTo(-10,-120,10,-70,10,-20); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
    const flash = stage.querySelector('.cam-flash');
    stage.querySelector('.shutter').addEventListener('click', ()=>{
      flash.classList.remove('on'); void flash.offsetWidth; flash.classList.add('on');
      const data = canvas.toDataURL('image/png');
      window.L.store.addPhoto({ id:'p'+Date.now(), data:data, cap:'此刻 · '+ui.hm(Date.now()), ts:Date.now() });
      ui.toast('已存入相册');
      if (window.L.system && window.L.system.tapHaptic) window.L.system.tapHaptic();
          });
    stage.querySelector('.cam-side:last-child').addEventListener('click', ()=>{ flip=!flip; });
    stage.querySelector('.cam-side:first-child').addEventListener('click', function(){
      this.style.color = this.style.color==='rgb(255, 255, 255)' ? '#ffd60a' : '#ffffff';
      ui.toast('闪光灯（模拟）');
    });
    el._cleanup = ()=>{ cancelAnimationFrame(raf); };
  }

  window.L = window.L || {};
  window.L.apps = { build:build, run:run, openChat:openChat, register:register, openCall:openCall, _defs:DEFS };
})();
</script>
<script>
/* apps-extra.js — 角色中心 / 相册 / 时钟 / 计算器 / 设置 */
(function(){
  const ui = window.L.ui, icons = window.L.icons;

  /* ================= 角色中心 hub ================= */
  const ROLES = {};
  function hubHead(el, title, back){
    const head = ui.h('<div class="app-head"><div class="ah-side"><button class="ah-btn bb">'+icons.inlineHTML('back',18,'')+'</button></div>'+
      '<div class="ah-t" style="position:static;transform:none"></div><div class="ah-spacer"></div></div>');

    head.querySelector('.bb').addEventListener('click', back);

  }
  function showHub(el, opts){
    opts = opts||{};
    el.innerHTML='';
    const head = hubHead(el, '角色', ()=> opts.back ? opts.back() : window.L.system.goHome());
    el.appendChild(head);
    const hub = ui.h('<div class="hub"><div class="hub-tabs"></div><div class="hub-body"></div></div>');
    el.appendChild(hub);
    const tabs = [
      {id:'plaza', label:'广场'},
      {id:'key', label:'接key'},
      {id:'create', label:'自建'},
      {id:'mine', label:'我的'}
    ];
    const tabbar = hub.querySelector('.hub-tabs');
    const body = hub.querySelector('.hub-body');
    const views = {};
    tabs.forEach(t=>{
      const b = document.createElement('button');
      b.textContent = t.label;
      b.dataset.tab = t.id;
      b.addEventListener('click', ()=> show(t.id));
      tabbar.appendChild(b);
      views[t.id] = null;
    });
    function show(tab){
      tabbar.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.tab===tab));
      body.innerHTML='';
      if (tab==='plaza') viewPlaza(body);
      else if (tab==='key') viewKey(body);
      else if (tab==='create') viewCreate(body);
      else viewMine(body);
    }
    show(opts.tab || 'plaza');
  }
  function charMini(ch){
    const tags = (ch.tags||[]).map(ui.chip).join('');
    return '<div class="char-card"><div class="av"></div><div class="ch-info"><div class="ch-name"></div>'+
      '<div class="ch-tag"></div><div class="ch-bio"></div></div><div class="ch-act"></div></div>';
  }
  function fillMini(card, ch, actHTML){
    card.querySelector('.av').appendChild(ui.avatarImg(ch,58));
    card.querySelector('.ch-name').textContent = ch.name + ' · ' + (ch.age||'') + '岁';
    const tag = card.querySelector('.ch-tag');
    (ch.tags||[]).forEach(t=> tag.insertAdjacentHTML('beforeend','<span class="chip">'+ui.esc(t)+'</span>'));
    tag.insertAdjacentHTML('beforeend','<span style="color:rgba(255,255,255,.4);font-size:10.5px"> '+ui.esc(ch.tagline||'')+'</span>');
    card.querySelector('.ch-bio').textContent = ch.bio || ch.style || '';
    card.querySelector('.ch-act').innerHTML = actHTML;
  }
  function viewPlaza(body){
    const ids = L.data.PLAZA;
    ids.forEach(id=>{
      const ch = L.data.CHARS[id];
      const owned = window.L.store.isOwned(id);
      const card = ui.h(charMini(ch));
      fillMini(card, ch, owned
        ? '<span class="chip">已拥有</span>'
        : '<button class="le-btn" style="padding:8px 16px;font-size:12px">添加</button>');
      if (!owned){
        card.querySelector('button').addEventListener('click', ()=>{
          window.L.store.addChar(id);
          window.L.store.pushMsg(id,'char', window.L.engine.greeting(ch));
          ui.toast('已添加 '+ch.name+'，去聊天吧');
          viewPlaza(body);
        });
      }
      body.appendChild(card);
    });
    // 专属角色提示
    const tip = ui.h('<div class="key-box"><div class="kb-t">还有专属角色（如顾屿、江野）由对方通过<b>解锁码</b>分发，输入码即可解锁。</div><button class="le-btn ghost" style="font-size:12px;padding:10px 18px">去输入解锁码</button></div>');
    tip.querySelector('button').addEventListener('click', ()=> showKeyTab());
    body.appendChild(tip);
    function showKeyTab(){ const b = body.parentElement.querySelector('.hub-tabs [data-tab=key]'); if (b) b.click(); }
  }
  function viewKey(body){
    const box = ui.h('<div class="key-box"><div class="kb-t">输入对方给你的专属解锁码<br>解锁后角色会出现在「我的」与聊天列表</div>'+
      '<input class="le-input code-input" placeholder="例如 LEANO-GU" maxlength="20" style="margin-bottom:12px">'+
      '<button class="le-btn" style="width:100%">解锁</button><div class="kb-result" style="margin-top:12px;font-size:12.5px;color:rgba(255,255,255,.55)"></div></div>');
    const input = box.querySelector('input'), res = box.querySelector('.kb-result');
    function unlock(){
      const code = input.value.trim();
      if (!code){ res.textContent='请输入解锁码'; return; }
      const r = window.L.store.useCode(code);
      if (!r.ok){
        res.textContent = r.reason==='used' ? '这个解锁码已经用过了哦' : '解锁码无效，请核对后重试';
        return;
      }
      const ch = L.data.CHARS[r.id];
      if (!window.L.store.isOwned(r.id)){
        window.L.store.addChar(r.id);

    box.querySelector('button').addEventListener('click', unlock);

    const s = window.L.store.get();
    const kb = ui.h('<div class="field" style="margin-top:6px"><div class="fl"><b>绑定你自己的 key</b>（二期接入真实 AI 时使用，仅保存在本机）</div>'+
      '<input class="le-input" type="password" placeholder="粘贴你的 API Key" style="margin-bottom:10px">'+
      '<button class="le-btn ghost" style="width:100%">保存绑定</button></div>');
    const kinput = kb.querySelector('input');
    kinput.value = s.ownKey || '';
    kb.querySelector('button').addEventListener('click', ()=>{
      window.L.store.setOwnKey(kinput.value);
      ui.toast('已保存（仅存本机）');
    });
    body.appendChild(kb);
    const note = ui.h('<div style="font-size:11.5px;color:rgba(255,255,255,.35);line-height:1.8">演示解锁码：LEANO-GU（顾屿）、LEANO-JIANG（江野）</div>');
    body.appendChild(note);
  }
  function viewCreate(body){
    const form = ui.h('<div></div>');
    const fName = ui.h('<div class="field"><div class="fl">角色名字 <b>*</b></div><input class="le-input" maxlength="12" placeholder="例如：林深"></div>');
    const fMotif = ui.h('<div class="field"><div class="fl">头像风格</div><div class="tagpick motifs"></div></div>');
    const motifKeys = ['heart','swan','kiss','moon','ring'];
    let motif = 'heart';
    const mpick = fMotif.querySelector('.motifs');
    motifKeys.forEach(m=>{
      const b = document.createElement('button');
      b.style.cssText = 'width:46px;height:46px;padding:0;border-radius:50%;overflow:hidden;display:flex;align-items:center;justify-content:center;';
      const im = document.createElement('img');
      im.src = icons.avatarMotifURL(m); im.style.cssText='width:100%;height:100%;border-radius:50%;';
      b.appendChild(im);
      b.addEventListener('click', ()=>{ motif=m; mpick.querySelectorAll('button').forEach(x=>x.classList.remove('on')); b.classList.add('on'); });
      mpick.appendChild(b);

    const fTag = ui.h('<div class="field"><div class="fl">性格/说话风格 <b>*</b></div><div class="tagpick"></div></div>');
    const tpick = fTag.querySelector('.tagpick');

    const save = ui.h('<button class="le-btn" style="width:100%">创建角色</button>');
    form.appendChild(fName); form.appendChild(fMotif); form.appendChild(fTag); form.appendChild(fTagline); form.appendChild(fBio); form.appendChild(save);
    save.addEventListener('click', ()=>{
      const name = fName.querySelector('input').value.trim();

      const label = L.data.ARCHETYPES[tag].label;
      const ch = { id:'c'+Date.now(), kind:'local', name:name, gender:'male', age:22, role:'恋人',
        avatar:'motif', motif:motif, tagline:tagline||'只属于你的角色', tags:[label],
        bio:bio || ('由你亲手创建的角色，性格偏「'+label+'」。'),
        style:'基于「'+label+'」原型生成回复；二期接入真实 AI 后完全按你的人设走。' };
      window.L.store.addCreatedChar(ch);
      window.L.store.pushMsg(ch.id,'char', window.L.engine.greeting(ch));

  function viewMine(body){
    const chars = window.L.store.myChars();
    if (!chars.length){
      body.appendChild(ui.h('<div class="chat-empty"><div class="ce-ic">'+icons.inlineHTML('heartLine',30,'')+'</div><div>还没有角色<br>去广场添加，或输入解锁码</div></div>'));

      fillMini(card, ch, '<button class="le-btn" data-a="chat" style="padding:7px 12px;font-size:11.5px;margin-bottom:6px">聊天</button>'+
        '<button class="le-btn ghost danger" data-a="del" style="padding:6px 12px;font-size:11px">'+(isLocal?'删除':'移除')+'</button>');
      card.querySelector('[data-a=chat]').addEventListener('click', ()=> window.L.apps.openChat(ch.id));
      card.querySelector('[data-a=del]').addEventListener('click', ()=>{
        ui.sheet('移除角色', '移除后，与 <b>'+ui.esc(ch.name)+'</b> 的对话将不再显示。（本地数据仍保留，重新添加可恢复）', {
          buttons:[{label:'确认移除', danger:true, onClick:()=>{ window.L.store.removeChar(ch.id); viewMine(body); }}]

  ROLES.showHub = showHub;

  /* ================= 相册 ================= */
  function buildPhotos(el){
    el.appendChild(ui.h('<div class="app-head"><div class="ah-t">照片</div><div class="ah-spacer"></div><div class="ah-side"></div></div>'));
    const body = ui.h('<div class="body"></div>');
    el.appendChild(body);
    render(body);
    function render(container){
      container.innerHTML='';
      const grid = ui.h('<div class="photos-grid"></div>');
      const store = window.L.store.get();
      const items = [];
      store.photos.forEach(p=> items.push({cap:p.cap||'此刻', src:p.data}));
      L.data.SAMPLE_PHOTOS.forEach(p=> items.push({cap:p.cap, src: icons.sceneURL(p.scene, 300, 300), sample:true}));
      if (!items.length){
        container.appendChild(ui.h('<div class="chat-empty"><div class="ce-ic">'+icons.inlineHTML('photos',30,'')+'</div><div>暂无照片</div></div>'));

    el._returnHeader = ()=>{};

  /* ================= 时钟 ================= */
  function buildClock(el){
    el.classList.add('clock-app');
    el.appendChild(ui.h('<div class="app-head"><div class="ah-t">时钟</div><div class="ah-spacer"></div><div class="ah-side"></div></div>'));
    const seg = ui.h('<div class="seg clock-seg"><button class="on" data-v="world">世界时钟</button><button data-v="sw">秒表</button><button data-v="timer">计时器</button></div>');
    el.appendChild(seg);
    const body = ui.h('<div class="body"></div>');
    el.appendChild(body);
    const views = {};
    function show(v){
      seg.querySelectorAll('button').forEach(b=>b.classList.toggle('on', b.dataset.v===v));
      body.innerHTML='';
      if (v==='world'){ views.world = views.world || buildWorld(); body.appendChild(views.world); tickWorld(); }
      else if (v==='sw'){ views.sw = views.sw || buildStopwatch(); body.appendChild(views.sw); }
      else { views.timer = views.timer || buildTimer(); body.appendChild(views.timer); }
    }
    seg.addEventListener('click', e=>{ const b=e.target.closest('button'); if (b) show(b.dataset.v); });
    let wt = null;
    show('world');
    function tickWorld(){
      const list = body.querySelector('.world-list');
      if (!list) return;
      list.querySelectorAll('.wr-row').forEach(row=>{
        const tz = row.dataset.tz;
        const fmt = new Intl.DateTimeFormat('zh-CN', { timeZone:tz, hour:'2-digit', minute:'2-digit', hour12:false });
        row.querySelector('.wr-time').textContent = fmt.format(new Date());
      });
    }
    function buildWorld(){
      const wrap = ui.h('<div class="world-list"></div>');
      L.data.CITIES.forEach(c=>{
        const row = ui.h('<div class="wr-row" data-tz="'+c.tz+'"><div><div class="wr-city"></div><div class="wr-diff"></div></div><div class="wr-time"></div></div>');
        row.querySelector('.wr-city').textContent = c.name;
        row.querySelector('.wr-diff').textContent = c.diff;
        wrap.appendChild(row);
      });
      if (wt) clearInterval(wt);
      wt = setInterval(tickWorld, 1000);
      return wrap;
    }
    function buildStopwatch(){
      const wrap = ui.h('<div class="stopwatch"><div class="sw-time">00:00.00</div><div class="sw-laps"></div>'+
        '<div class="sw-ctl"><button class="lap">计次</button><button class="go">启动</button></div></div>');
      const timeEl = wrap.querySelector('.sw-time'), lapsEl = wrap.querySelector('.sw-laps');
      let running=false, base=0, start=0, timer=null;
      function renderTime(){
        const t = base + (running? Date.now()-start : 0);
        const cs = Math.floor(t/10)%100, s = Math.floor(t/1000);
        timeEl.textContent = String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(cs).padStart(2,'0');
      }
      wrap.querySelector('.go').addEventListener('click', function(){
        if (!running){ running=true; start=Date.now(); this.textContent='停止'; this.className='stop'; timer=setInterval(renderTime, 33); }
        else { running=false; clearInterval(timer); base += Date.now()-start; this.textContent='启动'; this.className='go'; }
      });
      wrap.querySelector('.lap').addEventListener('click', ()=>{
        const t = base + (running? Date.now()-start:0);
        const cs=Math.floor(t/10)%100, s=Math.floor(t/1000);
        const laps = lapsEl.querySelectorAll('.sw-lap').length+1;
        const row = ui.h('<div class="sw-lap"><span>计次 '+laps+'</span><span>'+(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')+'.'+String(cs).padStart(2,'0'))+'</span></div>');
        lapsEl.prepend(row);
      });
      return wrap;
    }
    function buildTimer(){
      const wrap = ui.h('<div class="timer-set"><div class="timer-disp">00:00</div><div class="timer-wheel"></div><div class="timer-ctl"><button class="lap" style="background:rgba(255,255,255,.12);color:#fff">取消</button><button class="go" style="background:#2e7d32;color:#fff">开始</button></div></div>');
      const disp = wrap.querySelector('.timer-disp');
      let total = 0, left = 0, running=false, timer=null, endAt=0;
      const wheel = wrap.querySelector('.timer-wheel');
      const add = (n, label)=>{
        const d = ui.h('<div class="tw-n"><div style="font-size:11px;opacity:.55;margin-bottom:2px">'+label+'</div>'+n+'</div>');
        d.addEventListener('click', ()=>{ if(!running){ total=Math.min(3599,total+n* (label==='分'?60:1)); render(); } });
        wheel.appendChild(d);
      };
      [1,5,10].forEach(n=>add(n,'分')); [1,5,10].forEach(n=>add(n,'秒'));
      function render(){ disp.textContent = ui.fmtClock(running? left*1000 : total*1000); }
      function tick(){
        left = Math.max(0, Math.round((endAt-Date.now())/1000));
        render();
        if (left<=0){ clearInterval(timer); running=false; beep(); wrap.querySelector('.go').textContent='开始'; wrap.querySelector('.go').style.background='#2e7d32'; }
      }
      function beep(){
        try{
          const AC = window.AudioContext||window.webkitAudioContext;
          if (AC){ const ac = new AC(); [0,0.35,0.7].forEach((d,i)=>{ const o=ac.createOscillator(); const g=ac.createGain(); o.connect(g); g.connect(ac.destination); o.frequency.value=880; g.gain.setValueAtTime(0.0001, ac.currentTime+d); g.gain.exponentialRampToValueAtTime(0.2, ac.currentTime+d+0.02); g.gain.exponentialRampToValueAtTime(0.0001, ac.currentTime+d+0.25); o.start(ac.currentTime+d); o.stop(ac.currentTime+d+0.3); }); }
        }catch(e){}
        ui.toast('时间到 ⏰');
      }
      wrap.querySelector('.go').addEventListener('click', function(){
        if (!running){
          if (total<=0) return;
          running=true; left=total; endAt = Date.now()+left*1000;
          this.textContent='暂停'; this.style.background='#b71c1c';
          timer=setInterval(tick, 250);
        } else {
          clearInterval(timer); total = left; running=false;
          this.textContent='继续'; this.style.background='#2e7d32';
        }
      });
      wrap.querySelector('.lap').addEventListener('click', ()=>{ clearInterval(timer); running=false; total=0; left=0; render(); wrap.querySelector('.go').textContent='开始'; wrap.querySelector('.go').style.background='#2e7d32'; });
      render();
      return wrap;
    }
  }

  /* ================= 计算器 ================= */
  function buildCalc(el){
    el.classList.add('calc-app');
    el.appendChild(ui.h('<div class="app-head"><div class="ah-t">计算器</div><div class="ah-spacer"></div><div class="ah-side"></div></div>'));
    const body = ui.h('<div class="calc-body"><div class="calc-display"><div class="cd">0</div></div><div class="calc-keys"></div></div>');
    el.appendChild(body);
    const cd = body.querySelector('.cd'), keys = body.querySelector('.calc-keys');
    let cur='0', acc=null, op=null, fresh=true;
    function fmt(n){ return String(Math.round(n*1e10)/1e10); }
    function render(){ cd.textContent = cur.length>12 ? Number(cur).toExponential(5) : cur; }
    function press(key){
      if (/^[0-9]$/.test(key)){
        if (fresh){ cur=key; fresh=false; }
        else cur = cur==='0'? key : cur+key;
        if (cur.length>16) cur=cur.slice(0,16);
      } else if (key==='.'){
        if (fresh){ cur='0.'; fresh=false; }
        else if (cur.indexOf('.')<0) cur+='.';
      } else if (key==='AC'){ cur='0'; acc=null; op=null; fresh=true; }
      else if (key==='±'){ cur = cur.charAt(0)==='-' ? cur.slice(1) : (cur==='0'?cur:'-'+cur); }
      else if (key==='%'){ cur = fmt(parseFloat(cur)/100); }
      else if (['+','-','×','÷'].indexOf(key)>=0){
        if (op && !fresh){ compute(); }
        acc = parseFloat(cur); op=key; fresh=true;
      } else if (key==='='){
        if (op!=null && !fresh){ compute(); op=null; }
      }
      render();
      function compute(){
        const b = parseFloat(cur);
        const a = acc;
        let r = 0;
        if (op==='+') r=a+b; else if (op==='-') r=a-b; else if (op==='×') r=a*b; else if (op==='÷') r = b===0? NaN : a/b;
        cur = isNaN(r) ? '错误' : fmt(r);
        acc=null; fresh=true;
      }
    }
    const rows = [
      ['AC','±','%','÷'],
      ['7','8','9','×'],
      ['4','5','6','-'],
      ['1','2','3','+'],
      ['0','.','=']
    ];

        const b = document.createElement('button');

        b.className = 'calc-key ' + (k==='AC'||k==='±'||k==='%' ? 'ck-fn' : (['÷','×','-','+','='].indexOf(k)>=0 ? 'ck-op' : 'ck-num'));

  /* ================= 设置 ================= */
  function buildSettings(el){
    el.appendChild(ui.h('<div class="app-head"><div class="ah-t">设置</div><div class="ah-spacer"></div><div class="ah-side"></div></div>'));

    const s = window.L.store.get();
    function row(icon, label, right, click){

    function sw(key, init){

    const ICON_NAMES = {wechat:'微信', x:'X', vinyl:'Vinyl', douyin:'抖音', film:'放映室', camera:'相机', photos:'照片', calc:'计算器', worldbook:'世界书', phone:'电话', music:'音乐', spyphone:'查他手机', browser:'浏览器', task:'任务设备', couple:'情侣空间', ai:'AI账户', waimai:'外卖', shop:'购物', plane:'云程', candle:'规则怪谈', door:'惊悚抉择', roleplay:'角色扮演', rose:'线下约会', clock:'时钟', calendar:'日历', game:'游戏', mail:'邮件', gear:'设置'};
    function imgCount(){ const c = window.L.store.get().custom||{}; return Object.keys(c).length; }
    function refreshImgCount(){ const e = ui.q('#imgcount'); if (e) e.textContent = imgCount()+' 张'; }
    function defSlot(key){
      if (key==='wallpaper'||key==='lock') return icons.wallpaperURL();
      if (key==='widget') return icons.sceneURL('kiss',200,200);
      if (key==='collage0') return icons.sceneURL('wings',200,200);
      if (key==='collage1') return icons.sceneURL('swan',200,200);
      if (key==='collage2') return icons.sceneURL('lily',200,200);
      if (key==='avatar:user') return icons.avatarMotifURL('kiss');
      if (key==='avatar:eric') return icons.avatarMotifURL('swan');
      return icons.appIcon('gear');
    }
    function refreshAppearance(){ window.L.home.build(); refreshImgCount(); }
    function customImgSheet(){
      let html = '<div style="padding:2px 0">';
      IMG_SLOTS.forEach(sl=>{
        const cur = window.L.store.getCustom(sl.key);
        const src = cur || defSlot(sl.key);
        html += '<div class="ci-row" data-slot="'+sl.key+'"><img class="ci-prev" src="'+src+'"><div class="ci-mid"><div class="ci-lb">'+sl.label+'</div><div class="ci-st">'+(cur?'已自定义':'默认')+'</div></div>'+
          '<button class="ci-btn set">更换</button><button class="ci-btn rst">重置</button></div>';
      });
      html += '<div style="font-size:12px;color:rgba(255,255,255,.5);margin:12px 2px 6px">App 图标（点一下即可换成你的图片）</div>';
      html += '<div class="ci-grid">';
      ICON_KEYS.forEach(k=>{
        const cur = window.L.store.getCustom('icon:'+k);
        html += '<div class="ci-tile" data-k="'+k+'"><img src="'+(cur||icons.appIcon(k))+'"><span>'+(ICON_NAMES[k]||k)+'</span>'+(cur?'<i class="ci-dot"></i>':'')+'</div>';
