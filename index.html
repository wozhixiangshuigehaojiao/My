<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leano">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<title>Leano · 小手机</title>
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/apps.css">
<link rel="stylesheet" href="css/theme.css">
</head>
<body>
<div id="stage">
  <div id="screen">
    <div id="boot" class="layer boot"></div>
    <div id="agegate" class="layer agegate hidden"></div>
    <div id="lock" class="layer lock hidden"></div>
    <div id="home" class="layer home hidden"></div>
    <div id="appview" class="layer appview hidden"></div>
    <div id="statusbar" class="statusbar hidden"></div>
    <div id="homeindicator" class="homeindicator hidden"></div>
    <div id="controlcenter" class="cc hidden"></div>
    <div id="notifcenter" class="notif hidden"></div>
    <div id="switcher" class="switcher hidden"></div>
    <div id="sheet" class="sheet hidden"></div>
    <div id="toast" class="toast hidden"></div>
    <div id="curtain" class="curtain"></div>
  </div>
</div>
<script src="js/icons.js"></script>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script src="js/ui.js"></script>
<script src="js/engine.js"></script>
<script src="js/home.js"></script>
<script src="js/apps-core.js"></script>
<script src="js/apps-extra.js"></script>
<script src="js/system.js"></script>
<script src="js/main.js"></script>
</body>
</html>
